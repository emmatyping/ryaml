[build-system]
requires = [
    "maturin>=1,<2",
]
build-backend = "maturin"

[project]
name = "ryaml"
version = "0.6.0"
description = "A pyyaml compatible YAML 1.1 parser in Rust."
readme = "README.md"
requires-python = ">=3.10,<4"
license = {text = "MIT"}
keywords = ["yaml", "parsing"]
authors = [
    { name = "Emma Harper Smith", email = "emma@emmatyping.dev" },
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Typing :: Typed",
]

[project.urls]
homepage = "https://github.com/emmatyping/ryaml"
repository = "https://github.com/emmatyping/ryaml"

[tool.maturin]
python-source = "py-src"
module-name = "ryaml._ryaml"
include = [
    { format = "sdist", path = "Cargo.lock" },
    { format = "sdist", path = "examples/" },
    { format = "sdist", path = "tests/" },
]

[tool.cibuildwheel]
skip = "*-win32"
test-groups = ["test"]
test-command = "python -m pytest {project}/tests"
build-verbosity = 1

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.12"

[tool.cibuildwheel.android.environment]
# The cross-build environment places target Python next to the build venv.
PYO3_CROSS_LIB_DIR = "$VIRTUAL_ENV/../python/prefix/lib"
CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER = "$(pwd)/.github/scripts/android-linker.sh"
CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER = "$(pwd)/.github/scripts/android-linker.sh"

[tool.cibuildwheel.ios]
xbuild-tools = ["rustc", "cargo"]

[tool.cibuildwheel.ios.environment]
# Use the target Python version and framework from the cross-build venv.
PYO3_CROSS_PYTHON_VERSION = '''$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')'''
CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS = '''$(python -c 'import sysconfig; print("-Lframework=" + sysconfig.get_config_var("PYTHONFRAMEWORKPREFIX") + " -lframework=Python")')'''
CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUSTFLAGS = "$CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS"

[tool.cibuildwheel.pyodide]
build = "cp313-pyodide_wasm32"
xbuild-tools = ["rustc", "cargo"]

[[tool.cibuildwheel.overrides]]
select = "*-musllinux_*"
# Older CPython builds report a GNU SOABI inside the musl container.
before-all = """
curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/ryaml-rustup.sh &&
sh /tmp/ryaml-rustup.sh -y --profile minimal
"""
environment.PATH = "$HOME/.cargo/bin:$PATH"

[[tool.cibuildwheel.overrides]]
select = "*-{android,ios,pyodide}_*"
test-groups = []
test-sources = ["tests/test_wheel.py"]
test-command = "python -m unittest discover -s tests -p test_wheel.py"

[[tool.cibuildwheel.overrides]]
select = "*-android_x86_64"
inherit.environment = "append"
environment.CARGO_BUILD_TARGET = "x86_64-linux-android"

[[tool.cibuildwheel.overrides]]
select = "*-android_arm64_v8a"
inherit.environment = "append"
environment.CARGO_BUILD_TARGET = "aarch64-linux-android"

[dependency-groups]
test = [
    "hypothesis>=6.0",
    "psutil>=7.0",
    "pytest>=9.0",
    "pyyaml>=6.0.3",
]

[tool.hatch.envs.default]
dependency-groups = ["test"]

[tool.hatch.envs.hatch-test]
dependency-groups = ["test"]

[tool.hatch.envs.fuzz]
extra-dependencies = [
    "atheris"
]
python = "3.13"
platforms = ["linux"]
# Since we need the rustc wrapper, install with sanitizer and fuzzer support
# ourselves
post-install-commands = [
    "RUSTC_WRAPPER=./fuzz/sancov-rustc-wrapper.sh maturin develop --release",
]

[tool.hatch.envs.fuzz.scripts]
run = 'ASAN_OPTIONS="detect_leaks=0:allocator_may_return_null=1:handle_segv=0" LD_PRELOAD="$(python -c "import atheris; print(atheris.path())")/asan_with_fuzzer.so" python ./fuzz/run.py {args:fuzz/corpus fuzz/seed -fork=4 -max_len=1024}'
