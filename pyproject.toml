[build-system]
requires = [
    "maturin>=1.13.1,<2",
]
build-backend = "maturin"

[project]
name = "ryaml"
version = "0.6.0"
description = "A pyyaml compatible YAML 1.1 parser in Rust."
readme = "README.md"
requires-python = ">=3.10,<4"
license = {text = "MIT"}
keywords = ["yaml", "parsing"]
authors = [
    { name = "Emma Harper Smith", email = "emma@emmatyping.dev" },
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Typing :: Typed",
]

[project.urls]
homepage = "https://github.com/emmatyping/ryaml"
repository = "https://github.com/emmatyping/ryaml"

[tool.maturin]
python-source = "py-src"
module-name = "ryaml._ryaml"
include = [
    { format = "sdist", path = "Cargo.lock" },
    { format = "sdist", path = "examples/" },
    { format = "sdist", path = "tests/" },
]

[tool.cibuildwheel]

[dependency-groups]
test = [
    "hypothesis>=6.0",
    "pytest>=9.0",
    "pyyaml>=6.0",
]

[tool.hatch.envs.default]
dependency-groups = ["test"]

[tool.hatch.envs.hatch-test]
dependency-groups = ["test"]

[tool.hatch.envs.fuzz]
extra-dependencies = [
    "atheris"
]
python = "3.13"
platforms = ["linux"]
# Since we need the rustc wrapper, install with sanitizer and fuzzer support
# ourselves
post-install-commands = [
    "RUSTC_WRAPPER=./fuzz/sancov-rustc-wrapper.sh maturin develop --release",
]

[tool.hatch.envs.fuzz.scripts]
run = 'ASAN_OPTIONS="detect_leaks=0:allocator_may_return_null=1:handle_segv=0" LD_PRELOAD="$(python -c "import atheris; print(atheris.path())")/asan_with_fuzzer.so" python ./fuzz/run.py {args:fuzz/corpus fuzz/seed -fork=4 -max_len=1024}'
