name: Build and upload to PyPI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true


jobs:
  build_wheels:
    name: Build wheels for ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-intel
            runs-on: ubuntu-latest
          - os: linux-arm
            runs-on: ubuntu-24.04-arm
          - os: windows-intel
            runs-on: windows-latest
          - os: windows-arm
            runs-on: windows-11-arm
          - os: macos-intel
            runs-on: macos-15-intel
          - os: macos-arm
            runs-on: macos-latest
          - os: android-intel
            runs-on: ubuntu-latest
            platform: android
            archs: x86_64
            targets: x86_64-linux-android
          - os: android-arm
            # cibuildwheel only runs Android emulator tests on the host architecture.
            runs-on: ubuntu-latest
            platform: android
            archs: arm64_v8a
            targets: aarch64-linux-android
          - os: ios
            runs-on: macos-15
            platform: ios
            archs: arm64_iphoneos arm64_iphonesimulator
            targets: aarch64-apple-ios,aarch64-apple-ios-sim
          - os: pyodide
            runs-on: ubuntu-latest
            platform: pyodide
            # Pyodide's Emscripten build passes nightly Rust flags.
            toolchain: nightly-2026-04-16
            targets: wasm32-unknown-emscripten

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain || 'stable' }}
          targets: ${{ matrix.targets }}

      - name: cache rust
        uses: Swatinem/rust-cache@v2
        with:
          key: wheel-build-${{ matrix.os }}

      - name: Set up Java for the Android testbed
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_PLATFORM: ${{ matrix.platform || 'auto' }}
          CIBW_ARCHS: ${{ matrix.archs || 'auto' }}

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v5
        with:
          # unpacks all CIBW artifacts except pyodide into dist/
          pattern: "!cibw-wheels-pyodide-*"
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
